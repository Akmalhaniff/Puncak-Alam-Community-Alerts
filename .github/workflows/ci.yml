name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build check
        run: npm run build
      - name: Tests (unit + API against an in-memory Postgres)
        run: npm test
