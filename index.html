<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102b2c" />
  <title>Puncak Alam Community Alerts</title>
  <!--OG-->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Banjir PA" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous" />
  <style>
    :root{--ink:#122b2b;--muted:#71807c;--paper:#f5f6f0;--white:#fff;--line:#e5e9e1;--green:#1e6658;--green2:#dff1e7;--lime:#d3ef72;--orange:#e87947;--orangebg:#fff0e7;--red:#b9493e;--redbg:#fff0ee;--blue:#e9f1f2;--shadow:0 16px 48px #17333112;--radius:22px}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .top{background:#102b2c;color:#f7f8f1;padding:15px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em}
    .brand-mark{width:38px;height:38px;border-radius:13px;background:var(--lime);display:grid;place-items:center;color:#133735}
    .brand-mark svg{width:23px}
    .brand span small{display:block;color:#a9beb5;font-size:10px;font-weight:550;letter-spacing:.13em;text-transform:uppercase;margin-top:1px}
    .top-right{display:flex;align-items:center;gap:13px;color:#d1ddd8;font-size:12px}
    .demo-pill{border:1px solid #49635c;border-radius:99px;padding:7px 11px;color:#e3f2d2;font-size:11px;font-weight:700;letter-spacing:.07em}
    .pulse{width:7px;height:7px;background:#9bd98c;display:inline-block;border-radius:50%;margin-right:6px;box-shadow:0 0 0 4px #9bd98c22}
    .auth-btn{background:#1e6658;color:white;border:1px solid #328272;padding:7px 12px;border-radius:10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
    .auth-btn:hover{background:#174f44}
    .admin-link{color:#d3ef72;font-weight:750;text-decoration:none;border:1px solid #49635c;border-radius:9px;padding:6px 10px}
    .admin-link:hover{background:#1b3c3b}
    .shell{max-width:1200px;margin:auto;padding:32px 24px 60px}
    .welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:22px}
    .eyebrow{color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.13em}
    .welcome h1{font-size:clamp(30px,4vw,43px);letter-spacing:-.055em;line-height:1.03;margin:7px 0 10px}
    .welcome p{color:#657572;margin:0;font-size:15px}
    .actions{display:flex;gap:9px;flex-wrap:wrap}
    .btn{border:0;border-radius:12px;background:var(--green);color:white;padding:12px 16px;font-weight:700;font-size:13px;box-shadow:0 5px 14px #1e665822;transition:.18s}
    .btn:hover{transform:translateY(-1px);background:#174f44}
    .btn.secondary{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
    .btn.secondary:hover{background:#f8faf6}
    .btn.urgent{background:var(--red);box-shadow:0 5px 14px #b9493e25}
    .btn.small{font-size:12px;padding:9px 12px;border-radius:10px}
    .notice{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;background:#fff9e7;border:1px solid #f0e7c9;color:#5b563d;border-radius:15px;font-size:12px;margin-bottom:20px}
    .notice b{color:#433e25}
    .notice-icon{font-size:17px;line-height:1.1}
    .layout{display:block}
    .panel{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .panel-head{padding:20px 21px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .panel-head h2{margin:0;font-size:17px;letter-spacing:-.025em}
    .panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .live-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#638079;white-space:nowrap}
    .live-label i{background:#64b78e;width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
    .map{height:390px;margin:0 16px 14px;border-radius:17px;position:relative;overflow:hidden;background:#e6eee5}
    .map-caption{position:absolute;z-index:1000;left:13px;top:12px;padding:6px 9px;background:#fff;border-radius:8px;font-size:10px;font-weight:700;box-shadow:0 2px 10px #142b2b18;pointer-events:none}
    .signal-pin{position:relative;width:29px;height:29px;border:3px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 8px #122b2b55;background:#dc7651}
    .signal-pin::after{content:"";position:absolute;inset:7px;border-radius:50%;background:white}
    .signal-pin.clear{background:#39836a}
    .signal-pin.uncertain{background:#e4a23a}
    .signal-pin.old{opacity:.7}
    .pin-wrap{width:29px;height:38px;display:flex;justify-content:center;cursor:pointer}
    .maplibregl-popup-content{font-size:12px;max-width:240px;border-radius:10px}
    .map-error{position:absolute;inset:0;display:grid;place-items:center;padding:22px;text-align:center;color:#52615d;font-size:13px}
    .map-pin-hint{font-size:10px;color:#667670;margin:0 20px 14px}
    .filters{display:flex;gap:7px;padding:0 20px 13px;overflow-x:auto}
    .filter{border:1px solid var(--line);background:white;border-radius:99px;padding:7px 11px;color:#63716d;font-size:11px;font-weight:700;white-space:nowrap}
    .filter.active{background:#173c38;color:#fff;border-color:#173c38}
    .feed{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px;max-height:500px;overflow-y:auto}
    .report{border:1px solid var(--line);border-radius:15px;padding:13px 14px;display:grid;grid-template-columns:10px 1fr auto;gap:11px;align-items:start}
    .report-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:#e1a23f;box-shadow:0 0 0 4px #e1a23f20}
    .report-dot.danger{background:#dc7259;box-shadow:0 0 0 4px #dc725920}
    .report-dot.clear{background:#4b9b76;box-shadow:0 0 0 4px #4b9b7620}
    .report-title{font-weight:750;font-size:13px;letter-spacing:-.01em}
    .report-meta{font-size:10px;color:#7d8984;margin-top:3px}
    .report p{font-size:12px;color:#52615d;margin:6px 0 0}
    .report-tag{border-radius:7px;background:#fff1e9;color:#a55435;font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;padding:5px 7px;white-space:nowrap}
    .report-tag.clear{background:#e8f5ed;color:#327451}
    .report-tag.uncertain{background:#fff7df;color:#816b29}
    .empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
    .bottom-note{color:#84908a;font-size:10px;text-align:center;margin:20px 0 0}
    .bottom-note a{color:#467064}
    dialog{border:0;padding:0;border-radius:20px;width:min(520px,calc(100vw - 26px));box-shadow:0 22px 90px #0c202c55;color:var(--ink)}
    dialog::backdrop{background:#0d2221a8;backdrop-filter:blur(3px)}
    .modal-head{padding:19px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start}
    .modal-head h2{margin:0;font-size:18px}
    .modal-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .x{border:0;background:#f2f4ee;border-radius:9px;width:31px;height:31px;color:#52615d;font-size:18px}
    .form{padding:18px 22px 22px;display:grid;gap:13px}
    .field label{display:block;font-size:11px;font-weight:750;margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;border:1px solid #dfe5dc;border-radius:10px;padding:10px 11px;outline:none;color:var(--ink);background:white;font-size:13px}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#5d9b82;box-shadow:0 0 0 3px #5d9b821c}
    .field textarea{min-height:78px;resize:vertical}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .form-note{background:#fff8e6;border-radius:9px;padding:9px 10px;color:#706540;font-size:10px}
    .form-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:3px}
    .toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#153a35;color:white;padding:11px 16px;border-radius:12px;font-size:12px;font-weight:650;box-shadow:var(--shadow);transition:.24s;z-index:100;pointer-events:none}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .toast{width:max-content;max-width:min(440px,calc(100vw - 32px));text-align:center;line-height:1.4}
    .auth-user{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#e3f2d2}
    .auth-user img{width:26px;height:26px;border-radius:50%;object-fit:cover}
    .auth-btn.signout{background:#b9493e;border-color:#d76255}
    .report-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
    .mini-btn{border:1px solid var(--line);background:#f6f8f3;color:#3c5a52;border-radius:8px;padding:5px 9px;font-size:10px;font-weight:750}
    .mini-btn:hover{background:#eaf1ea}
    .mini-btn.good{background:#e8f5ed;border-color:#cfe6d8;color:#28694f}
    .mini-btn.danger{background:#fff0ee;border-color:#f1d3cf;color:#a2453b}
    .report.faded{opacity:.62}
    .verified{color:#2a7a58;font-weight:800}
    .older-toggle{border:1px dashed #cfd8cf;background:none;border-radius:12px;padding:10px;color:#4d6660;font-size:11px;font-weight:700}
    .older-toggle:hover{background:#f6f8f3}
    .feed-error{padding:13px 14px;border-radius:13px;background:var(--redbg);color:#8d3a31;font-size:12px}
    .link-btn{border:0;background:none;padding:0;color:inherit;font-weight:800;text-decoration:underline}
    .field input:disabled{background:#f2f4ee;color:#52615d}
    /* ---- flood-prone hotspots ---- */
    .hotspot-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 20px 12px;flex-wrap:wrap}
    .hs-toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#3c5a52;cursor:pointer;user-select:none}
    .hs-toggle input{width:16px;height:16px;accent-color:#c2452f;margin:0}
    .hs-swatch{width:14px;height:14px;border-radius:50%;background:#e8603c33;border:2px solid #c2452f;flex:none}
    .hs-hint{font-size:11px;color:#667670}
    .hs-list-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:11px;font-weight:750;color:#3c5a52}
    .hs-list-btn:hover{background:#f6f8f3}
    .hs-list{margin:0 16px 14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .hs-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid #eef1ea;background:#fff;padding:10px 12px;color:var(--ink)}
    .hs-item:hover{background:#fbf6f4}
    .hs-item b{font-size:12px}
    .hs-item small{grid-column:1/-1;color:#6d7b76;font-size:11px}
    .hs-days{font-size:10px;font-weight:800;color:#a2453b;background:#fff0ee;border-radius:6px;padding:3px 7px;white-space:nowrap}
    .hs-bar{grid-column:1/-1;height:4px;border-radius:3px;background:#f3e2dd;overflow:hidden}
    .hs-bar i{display:block;height:100%;background:#d9654a}
    .hs-source{margin:0;padding:10px 12px;font-size:10px;color:#7d8984;background:#fafbf8}
    .hs-popup b{display:block;font-size:13px;margin-bottom:2px}
    .hs-popup .hs-days{display:inline-block;margin:3px 0}
    .hs-popup small{display:block;color:#6d7b76;margin-top:3px}
    .fab{display:none}

    [hidden]{display:none!important}
    .nowrap{white-space:nowrap}
    /* ---- language switch ---- */
    .lang-switch{display:flex;border:1px solid #49635c;border-radius:10px;overflow:hidden}
    .lang-switch button{border:0;background:transparent;color:#d1ddd8;font-size:11px;font-weight:800;padding:7px 10px;letter-spacing:.04em}
    .lang-switch button[aria-pressed="true"]{background:var(--lime);color:#133735}
    /* ---- notice, form helpers ---- */
    .notice-small{display:block;margin-top:4px;color:#7a7350}
    .row-inline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .pin-status{font-size:12px;color:#71807c}
    .pin-status.picked{color:#28694f;font-weight:700}
    .field-hint{display:block;margin-top:6px;font-size:11px;color:#7d8984}
    .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .photo-btn{cursor:pointer;display:inline-flex;align-items:center}
    .photo-btn:focus-within,#rPhoto:focus-visible + .photo-preview{outline:2px solid #5d9b82}
    .photo-preview{display:flex;align-items:center;gap:8px}
    .photo-preview img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
    /* ---- photos in reports ---- */
    .report-photo{display:block;margin-top:8px;width:fit-content}
    .report-photo img{display:block;width:100%;max-width:260px;max-height:200px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#eef1ea}
    .popup-photo{display:block;width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-bottom:6px}
    /* ---- footer ---- */
    .site-footer{max-width:1200px;margin:0 auto;padding:22px 24px 34px;text-align:center;color:#6d7b76}
    .footer-line{margin:0;font-size:13px;font-weight:600}
    .dev-name{display:inline-block;font-weight:800;color:#133735;background:var(--lime);padding:2px 9px;border-radius:8px;letter-spacing:.01em;transform:rotate(-1.5deg)}
    .footer-sub{margin:6px 0 0;font-size:11px;color:#8a9690}
    .donate-btn{margin-top:12px;border:1px solid #d9e7a8;background:#f6fbe4;color:#3b4d14;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:750}
    .donate-btn:hover{background:#eef7d2}
    .donate-body{padding:16px 22px 22px;text-align:center}
    .donate-body p{font-size:13px;color:#52615d;margin:0 0 14px}
    .donate-qr{display:block;width:min(340px,86vw);height:auto;margin:0 auto 6px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:6px}
    .donate-zoom{display:block;font-size:11px;color:#7d8984;margin:0 0 12px}
    .donate-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:min(340px,86vw);padding:13px 16px;margin:0 auto 4px;text-decoration:none;background:var(--green);font-size:14px}
    .donate-link:hover{background:#174f44}
    .donate-or{font-size:12px;color:#7d8984;margin:10px 0 8px !important}
    .donate-note{font-size:11px;color:#7d8984;margin:10px 0 0}

    /* ---- tools row: install + alerts ---- */
    .tools{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 18px}
    .tool-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:750;color:#28473f}
    .tool-btn:hover{background:#f6f8f3}
    .tool-btn.on{background:#e8f5ed;border-color:#cfe6d8;color:#1e6658}
    /* ---- water level ---- */
    .level-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .level-pick label{position:relative;cursor:pointer}
    .level-pick input{position:absolute;opacity:0;inset:0;margin:0}
    .level-pick span{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid #dfe5dc;border-radius:11px;padding:8px 4px;font-size:20px;line-height:1.1;text-align:center;background:#fff}
    .level-pick span b{font-size:11px;font-weight:700;color:#3c5a52}
    .level-pick input:checked + span{border-color:#c2452f;background:#fff0ee;box-shadow:0 0 0 2px #c2452f33}
    .level-pick input:focus-visible + span{outline:2px solid #5d9b82}
    .level-chip{display:inline-block;margin-top:6px;border-radius:7px;background:#fff0ee;color:#a2453b;font-size:11px;font-weight:800;padding:3px 8px}
    .confirm-count{display:inline-block;margin-left:6px;font-size:11px;color:#2a7a58;font-weight:700}
    .mini-btn.wa{background:#e9f8ef;border-color:#c9ecd6;color:#1d7a46}
    .mini-btn.flag{background:#fff;border-color:#eadad6;color:#9a5a4e}
    .mini-btn.done{background:#eef3ee;color:#6d7b76;cursor:default}
    .radar-time{font-size:11px;color:#667670}

    /* ---- phones ---- */
    @media (max-width: 640px){
      .top{padding:10px 14px;gap:10px}
      .brand{gap:8px;font-size:14px;line-height:1.2}
      .brand-mark{width:32px;height:32px;border-radius:10px}
      .brand-mark svg{width:19px}
      .top-right{gap:8px}
      .top-right > span:first-child{display:none}
      .auth-btn{padding:8px 10px;font-size:11px;white-space:nowrap}
      .brand > span{font-size:13px}
      .auth-user span{display:none}
      .admin-link{padding:7px 9px;font-size:11px}
      .shell{padding:16px 12px calc(96px + env(safe-area-inset-bottom))}
      .welcome{display:block;margin-bottom:12px}
      .eyebrow{font-size:10px}
      .welcome h1{font-size:27px;margin:4px 0 6px}
      .welcome p{font-size:13px}
      .welcome .actions{display:none}
      .notice{padding:10px 12px;font-size:11px;gap:9px;margin-bottom:12px;border-radius:12px}
      .panel{border-radius:16px}
      .panel-head{padding:14px 14px 10px}
      .panel-head h2{font-size:16px}
      .live-label{display:none}
      .map{height:min(58vh,520px);min-height:300px;margin:0 8px 10px;border-radius:12px}
      .map-caption{display:none}
      .hotspot-bar{margin:0 12px 10px}
      .hs-hint{display:none}
      .hs-list{margin:0 8px 12px}
      .hs-item{padding:12px}
      .filters{padding:0 12px 12px;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
      .filters::-webkit-scrollbar{display:none}
      .filter{padding:9px 13px;font-size:12px}
      .feed{max-height:none;overflow:visible;padding:0 8px 10px}
      .report{grid-template-columns:9px 1fr;gap:4px 10px;padding:12px}
      .report > div{grid-column:2}
      .report-tag{grid-column:2;grid-row:1;justify-self:start;margin-bottom:2px}
      .report-dot{grid-row:1/3}
      .report-title{font-size:14px}
      .report-meta{font-size:11px}
      .report p{font-size:13px}
      .mini-btn{padding:8px 12px;font-size:12px;border-radius:9px}
      .older-toggle{padding:13px;font-size:12px}
      .bottom-note{font-size:11px;margin-top:14px}
      .maplibregl-popup-content{max-width:220px}
      /* the report button stays within thumb reach */
      .fab{display:flex;align-items:center;justify-content:center;gap:6px;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;height:52px;border:0;border-radius:15px;background:var(--green);color:#fff;font-size:15px;font-weight:800;box-shadow:0 10px 28px #0d2a2655}
      .fab:active{transform:scale(.98)}
      .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
      /* report form as a bottom sheet */
      dialog{width:100vw;max-width:100vw;max-height:92vh;margin:auto 0 0;border-radius:20px 20px 0 0;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
      .modal-head{padding:16px 16px 12px;position:sticky;top:0;background:#fff;z-index:1}
      .modal-head h2{font-size:17px}
      .form{padding:14px 16px 16px;gap:12px}
      .form-row{grid-template-columns:1fr}
      .field input,.field select,.field textarea{font-size:16px;padding:12px}
      .form-buttons{position:sticky;bottom:0;background:#fff;padding-top:8px}
      .form-buttons .btn{flex:1;padding:14px}
      #choosePin,.photo-btn{padding:11px 14px}
      .lang-switch button{padding:8px 9px}
      .tools{margin:-4px 0 12px}
      .tool-btn{flex:1;justify-content:center;padding:11px 10px;font-size:12px}
      .level-pick span{font-size:22px;padding:10px 4px}
      .report-photo img{max-width:100%;max-height:240px}
      .site-footer{padding:6px 16px calc(96px + env(safe-area-inset-bottom))}
      .shell{padding-bottom:12px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5 20 6v5.7c0 5-3.4 8.1-8 9.8-4.6-1.7-8-4.8-8-9.8V6l8-3.5Z" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 13.2c1.8-1.2 3.1-1.2 4.8 0 1.7 1.2 3.1 1.2 5 0M8.2 16.1c1.2-.8 2.2-.8 3.4 0 1.2.8 2.2.8 3.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <span data-t="brand">Puncak Alam Community Alerts</span>
    </div>
    <div class="top-right">
      <div class="lang-switch" role="group" data-t-aria="lang_label" aria-label="Language">
        <button type="button" data-lang="ms">BM</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a class="admin-link" id="adminLink" href="/admin" hidden>Admin</a>
      <div id="authContainer"></div>
    </div>
  </header>

  <main class="shell">
    <section class="welcome">
      <div>
        <div class="eyebrow" data-t="eyebrow"></div>
        <h1 data-t="headline"></h1>
        <p data-t="lead"></p>
      </div>
      <div class="actions">
        <button class="btn" id="reportOpen" data-t="report_btn"></button>
      </div>
    </section>

    <div class="notice">
      <span class="notice-icon" aria-hidden="true">⚠️</span>
      <div><span data-t-html="notice"></span><small class="notice-small" data-t="notice_retention"></small></div>
    </div>

    <div class="tools">
      <button type="button" class="tool-btn" id="notifyBtn" hidden><span aria-hidden="true">🔔</span><span id="notifyLabel"></span></button>
      <button type="button" class="tool-btn" id="installBtn" hidden><span aria-hidden="true">📲</span><span data-t="install_btn"></span></button>
    </div>

    <section class="layout">
      <div class="panel">
        <div class="panel-head">
          <div><h2 data-t="map_title"></h2><p data-t="map_sub"></p></div>
          <span class="live-label"><i></i><span data-t="live_label"></span></span>
        </div>
        <div class="map" id="map" role="application" data-t-aria="map_aria">
          <span class="map-caption" data-t="map_caption"></span>
        </div>
        <div class="hotspot-bar">
          <label class="hs-toggle"><input type="checkbox" id="hsToggle" checked /><span class="hs-swatch" aria-hidden="true"></span><span data-t="hs_toggle"></span></label>
          <label class="hs-toggle"><input type="checkbox" id="radarToggle" /><span aria-hidden="true">🌧️</span><span data-t="radar_toggle"></span></label>
          <span class="radar-time" id="radarTime"></span>
          <span class="hs-hint" data-t="hs_hint"></span>
          <button type="button" class="hs-list-btn" id="hsListBtn" aria-expanded="false" aria-controls="hsList"></button>
        </div>
        <div class="hs-list" id="hsList" hidden></div>
        <div class="filters" role="group" data-t-aria="filters_aria">
          <button class="filter active" data-filter="all" data-t="f_all"></button>
          <button class="filter" data-filter="flood" data-t="f_flood"></button>
          <button class="filter" data-filter="road" data-t="f_road"></button>
          <button class="filter" data-filter="weather" data-t="f_weather"></button>
        </div>
        <div class="feed" id="feed"></div>
      </div>
    </section>

    <p class="bottom-note"><span data-t="bottom_note"></span> <a href="https://www.malaysia.gov.my/en/topics/mers-999-emergency-line" target="_blank" rel="noopener">MERS 999</a>.</p>
  </main>

  <footer class="site-footer">
    <p class="footer-line"><span data-t="footer_a"></span> <span class="nowrap"><span class="dev-name">akmalhanif</span> <span data-t="footer_b"></span></span></p>
    <p class="footer-sub" data-t="footer_sub"></p>
    <button type="button" class="donate-btn" id="donateBtn" hidden data-t="donate_btn"></button><!--DONATE-->
  </footer>

  <dialog id="reportDialog">
    <form class="modal" id="reportForm">
      <div class="modal-head">
        <div><h2 data-t="form_title"></h2><p data-t="form_sub"></p></div>
        <button class="x" type="button" data-close data-t-aria="close">×</button>
      </div>
      <div class="form">
        <div class="form-row">
          <div class="field"><label for="rArea" data-t="f_area"></label><input id="rArea" required maxlength="70" data-t-ph="f_area_ph" /></div>
          <div class="field"><label for="rType" data-t="f_type"></label><select id="rType"><option value="flood" data-t="type_flood"></option><option value="road" data-t="type_road"></option><option value="weather" data-t="type_weather"></option></select></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="rStatus" data-t="f_status"></label><select id="rStatus"><option value="danger" data-t="status_danger_opt"></option><option value="uncertain" data-t="status_uncertain_opt"></option><option value="clear" data-t="status_clear_opt"></option></select></div>
          <div class="field"><label for="rName" data-t="f_name"></label><input id="rName" maxlength="40" data-t-ph="f_name_ph" /></div>
        </div>
        <div class="field" id="levelField">
          <label data-t="f_level"></label>
          <div class="level-pick" role="radiogroup">
            <label><input type="radio" name="rLevel" value="ankle" /><span>🦶<b data-t="lvl_ankle"></b></span></label>
            <label><input type="radio" name="rLevel" value="knee" /><span>🦵<b data-t="lvl_knee"></b></span></label>
            <label><input type="radio" name="rLevel" value="waist" /><span>🧍<b data-t="lvl_waist"></b></span></label>
            <label><input type="radio" name="rLevel" value="car" /><span>🚗<b data-t="lvl_car"></b></span></label>
          </div>
        </div>
        <div class="field">
          <label data-t="f_spot"></label>
          <div class="row-inline">
            <button class="btn secondary small" type="button" id="useGps" data-t="f_spot_gps"></button>
            <button class="btn secondary small" type="button" id="choosePin" data-t="f_spot_btn"></button>
            <span id="pinStatus" class="pin-status"></span>
          </div>
        </div>
        <div class="field">
          <label for="rPhoto" data-t="f_photo"></label>
          <div class="row-inline">
            <label class="btn secondary small photo-btn" for="rPhoto" data-t="f_photo_btn"></label>
            <input type="file" id="rPhoto" accept="image/*" class="visually-hidden" />
            <div class="photo-preview" id="photoPreview" hidden>
              <img id="photoImg" alt="" />
              <button type="button" class="mini-btn danger" id="photoRemove" data-t="f_photo_remove"></button>
            </div>
          </div>
          <small class="field-hint" data-t="f_photo_hint"></small>
        </div>
        <div class="field"><label for="rDetails" data-t="f_details"></label><textarea id="rDetails" required maxlength="240" data-t-ph="f_details_ph"></textarea></div>
        <div class="form-note" data-t="form_note"></div>
        <div class="form-buttons">
          <button class="btn secondary" type="button" data-close data-t="cancel"></button>
          <button class="btn" type="submit" data-t="send"></button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="donateDialog">
    <div class="modal-head">
      <div><h2 data-t="donate_title"></h2></div>
      <button class="x" type="button" data-close data-t-aria="close">×</button>
    </div>
    <div class="donate-body">
      <p data-t="donate_text"></p>
      <a class="btn donate-link" href="https://payment.tngdigital.com.my/sc/bDLnQ01Pw2" target="_blank" rel="noopener noreferrer" data-t="donate_link"></a>
      <p class="donate-or" data-t="donate_or"></p>
      <a href="/icons/duitnow-qr.jpg" target="_blank" rel="noopener"><img class="donate-qr" id="donateQr" alt="DuitNow QR" /></a>
      <span class="donate-zoom" data-t="donate_zoom"></span>
      <a class="btn secondary small" id="donateSave" href="/icons/duitnow-qr.jpg" download="duitnow-akmalhanif.jpg" data-t="donate_save"></a>
      <p class="donate-note" data-t="donate_note"></p>
    </div>
  </dialog>

  <dialog id="notifyDialog">
    <form class="modal" id="notifyForm">
      <div class="modal-head">
        <div><h2 data-t="nt_title"></h2><p data-t="nt_sub"></p></div>
        <button class="x" type="button" data-close data-t-aria="close">×</button>
      </div>
      <div class="form">
        <div class="field">
          <label data-t="nt_where"></label>
          <div class="row-inline">
            <button type="button" class="btn secondary small" id="ntUseGps" data-t="nt_use_gps"></button>
            <button type="button" class="btn secondary small" id="ntUseMap" data-t="nt_use_map"></button>
            <span id="ntSpot" class="pin-status"></span>
          </div>
        </div>
        <div class="field"><label for="ntRadius" data-t="nt_radius"></label><select id="ntRadius"><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option></select></div>
        <div class="form-note" data-t="nt_note"></div>
        <div class="form-buttons">
          <button type="button" class="btn secondary" id="ntOff" data-t="nt_off" hidden></button>
          <button class="btn" type="submit" data-t="nt_on"></button>
        </div>
      </div>
    </form>
  </dialog>

  <button class="fab" type="button" id="reportFab" data-t="report_btn"></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

        nt_need_spot: 'Pick a place first.', nt_pick: 'Tap the map to pick the place for alerts.',

    };
    const LANG_KEY = 'pa-lang';
    let lang = (() => { try { return localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'ms'; } catch { return 'ms'; } })();
    function t(key, vars = {}) {
      const s = STR[lang][key] ?? STR.en[key] ?? key;
      return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
    }
    window.t = t;
    // Hotspot names/notes can be a plain string or { ms, en }.
    const L = v => (v && typeof v === 'object') ? (v[lang] ?? v.en) : v;

    // Server messages arrive in English; show them in the reader's language.
    const SERVER_ERRORS = {
      'Too many reports from this connection. Please wait a few minutes.': 'err_rate',
      'Map point must be in the Puncak Alam area.': 'err_bounds',
      'Photo must be a JPEG under 500 KB. Please try another photo.': 'err_photo',
      'Area is required.': 'err_required',
      'Details are required.': 'err_required',
      'Sign in to remove reports.': 'err_sign_in',
      'You can only remove your own reports.': 'err_own',
      'Sign in to report a problem.': 'flag_signin',
    };

    function applyStaticText() {
      document.documentElement.lang = lang === 'ms' ? 'ms' : 'en';
      document.title = t('page_title');
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll('[data-t-html]').forEach(el => { el.innerHTML = t(el.dataset.tHtml); }); // trusted strings from STR only
      document.querySelectorAll('[data-t-ph]').forEach(el => { el.placeholder = t(el.dataset.tPh); });
      document.querySelectorAll('[data-t-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.tAria)); });
      document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    }
    function setLang(next) {
      lang = next === 'en' ? 'en' : 'ms';
      try { localStorage.setItem(LANG_KEY, lang); } catch {}
      applyStaticText();
      window._onLangChange?.();
    }
    applyStaticText();
  </script>

  <!-- Firebase sign-in -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import firebaseConfig from './firebase-applet-config.json' with { type: 'json' };

    const auth = getAuth(initializeApp(firebaseConfig));
    const provider = new GoogleAuthProvider();
    window._getIdToken = async () => auth.currentUser ? await auth.currentUser.getIdToken() : null;

    const authContainer = document.getElementById('authContainer');
    const rNameInput = document.getElementById('rName');

    // Google refuses sign-in inside app web views (WhatsApp, Facebook, Instagram, etc.).
    const IN_APP_BROWSER = /FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|TikTok|Snapchat|Twitter|; wv\)/i.test(navigator.userAgent);
    const SIGN_IN_ERRORS = {
      'auth/popup-blocked': 'si_popup',
      'auth/operation-not-supported-in-this-environment': 'si_in_app',
      'auth/network-request-failed': 'si_network',
      'auth/web-storage-unsupported': 'si_storage',
      'auth/internal-error': 'si_in_app',
    };

    async function signIn() {
      if (IN_APP_BROWSER) return window._showToast(t('si_in_app'), 7000);
      try {
        await signInWithPopup(auth, provider);
        window._showToast(t('signed_in'));
      } catch (err) {
        if (err?.code === 'auth/popup-closed-by-user' || err?.code === 'auth/cancelled-popup-request') return;
        console.error('Sign-in error:', err);
        window._showToast(t(SIGN_IN_ERRORS[err?.code] || 'si_other'), 7000);
      }
    }

    // Built with DOM nodes (not innerHTML) so a display name can never inject markup.
    function renderAuth() {
      const user = auth.currentUser;
      authContainer.replaceChildren();
      if (!user) {
        const btn = document.createElement('button');
        btn.className = 'auth-btn';
        btn.textContent = t('sign_in');
        btn.onclick = signIn;
        authContainer.append(btn);
        return;
      }
      const wrap = document.createElement('div');
      wrap.className = 'auth-user';
      if (user.photoURL) {
        const img = document.createElement('img');
        img.src = user.photoURL; img.alt = ''; img.referrerPolicy = 'no-referrer';
        img.onerror = () => img.remove();
        wrap.append(img);
      }
      const name = document.createElement('span');
      name.textContent = user.displayName || user.email;
      const out = document.createElement('button');
      out.className = 'auth-btn signout';
      out.textContent = t('sign_out');
      out.onclick = () => signOut(auth);
      wrap.append(name, out);
      authContainer.append(wrap);
    }
    window._renderAuth = renderAuth;
    window._signIn = signIn;
    renderAuth();

    onAuthStateChanged(auth, (user) => {
      renderAuth();
      // Signed-in reports always use the Google name, so lock the field to match.
      if (user) {
        rNameInput.value = user.displayName || user.email.split('@')[0];
        rNameInput.disabled = true;
        rNameInput.title = t('name_locked');
      } else {
        rNameInput.value = '';
        rNameInput.disabled = false;
        rNameInput.title = '';
      }
      window._onAuthChange?.(!!user);
    });
  </script>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script>
    const MAP_STYLE='https://tiles.openfreemap.org/styles/liberty';
    const HOUR=3600000;
    const FADE_AFTER=2*HOUR;      // pins and cards fade once a report is this old
    const HIDE_AFTER=24*HOUR;     // older reports are hidden unless "Show older" is on
    const REFRESH_EVERY=60000;

    let reports=[], currentFilter='all', showOlder=false, loadError=false;
    let me={signedIn:false};
    let mapInstance=null, mapReady=false, reportMarkers=new Map(), draftMarker=null, selectedCoordinates=null;
    let pendingPhoto=null; // { thumb, full } JPEG data URLs, ready to upload
    let pickMode=null; // 'report' | 'notify' while the user taps the map to choose a spot
    let notifySpot=null; // [lat, lng] for flood alerts
    const BOUNDS={minLat:2.9,maxLat:3.6,minLng:101.1,maxLng:101.8};
    const inBounds=(lat,lng)=>lat>=BOUNDS.minLat&&lat<=BOUNDS.maxLat&&lng>=BOUNDS.minLng&&lng<=BOUNDS.maxLng;
    const CONFIRMED_KEY='pa-confirmed';
    const readJson=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};
    const writeJson=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
    let confirmedIds=new Set(readJson(CONFIRMED_KEY,[]));
    const FLAGGED_KEY='pa-flagged';
    let flaggedIds=new Set(readJson(FLAGGED_KEY,[]));

    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function toast(message,duration=3200){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),duration)}
    window._showToast=toast;

    const ageMs=r=>Date.now()-new Date(r.time).getTime();
    function ageLabel(iso){const mins=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));if(mins<1)return t('age_now');if(mins<60)return t('age_min',{n:mins});const h=Math.floor(mins/60);if(h<24)return t('age_hr',{n:h});return t('age_day',{n:Math.floor(h/24)});}
    const fmtTime=iso=>new Date(iso).toLocaleString(lang==='ms'?'ms-MY':'en-MY',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
    // The server's default poster name is English; show it in the reader's language.
    const whoName=r=>(!r.who||r.who==='Community member')?t('anon'):r.who;
    const photoUrl=(id,full)=>`/api/reports/${encodeURIComponent(id)}/photo${full?'?size=full':''}`;

    async function authHeaders(json){
      const h=json?{'Content-Type':'application/json'}:{};
      const token=window._getIdToken?await window._getIdToken():null;
      if(token)h['Authorization']=`Bearer ${token}`;
      return h;
    }
    async function errorMessage(res){
      if(res.status===413)return t('err_photo'); // upload bigger than the server accepts
      try{const body=await res.json();if(body?.error)return t(SERVER_ERRORS[body.error]||'t_failed')}catch{}
      return t('t_failed');
    }

    // ----- data -----

    async function fetchReports(){
      try{
        const res=await fetch('/api/reports');
        if(!res.ok)throw new Error(`HTTP ${res.status}`);
        reports=await res.json();
        loadError=false;
      }catch(err){
        console.warn('Failed to load reports:',err);
        loadError=true;
      }
      renderReports();
    }

    window._onAuthChange=async signedIn=>{
      me={signedIn:false};
      if(signedIn){
        try{const res=await fetch('/api/me',{headers:await authHeaders()});if(res.ok)me=await res.json()}catch{}
      }
      document.getElementById('adminLink').hidden=!me.isAdmin;
      renderReports();
    };

    const canRemove=r=>me.signedIn&&(me.isAdmin||(r.userId!=null&&r.userId===me.userId));

    // A report is superseded when a later "clear" report exists at the same spot.
    function supersededBy(r){
      if(r.status==='clear')return null;
      return reports.find(c=>c.status==='clear'&&c.id!==r.id&&c.area===r.area&&c.lat===r.lat&&c.lng===r.lng&&new Date(c.time)>new Date(r.time))||null;
    }

    function visibleReports(){
      return reports
        .filter(r=>currentFilter==='all'||r.type===currentFilter)
        .filter(r=>showOlder||ageMs(r)<=HIDE_AFTER)
        .sort((a,b)=>new Date(b.time)-new Date(a.time));
    }
    const hiddenOlderCount=()=>reports.filter(r=>(currentFilter==='all'||r.type===currentFilter)&&ageMs(r)>HIDE_AFTER).length;

    // ----- flood-prone hotspots -----

    // Flood-prone spots, edited by the admin in /admin. Loaded from /api/hotspots.
    let FLOOD_HOTSPOTS=[];
    const hotspotGeoJSON=()=>({type:'FeatureCollection',features:FLOOD_HOTSPOTS.map((h,i)=>({type:'Feature',properties:{i,days:h.days},geometry:{type:'Point',coordinates:[h.lng,h.lat]}}))});
    async function loadHotspots(){
      try{
        const res=await fetch('/api/hotspots');if(!res.ok)throw new Error('HTTP '+res.status);
        FLOOD_HOTSPOTS=await res.json();
      }catch(err){console.warn('Hotspots:',err);return}
      mapInstance?.getSource('hotspots')?.setData(hotspotGeoJSON());
      renderHotspotList();
    }
    const HS_KEY='pa-show-hotspots';
    let hsPopup=null, hsPopupSpot=null;
    function readPref(){try{return localStorage.getItem(HS_KEY)!=='0'}catch{return true}}
    function writePref(v){try{localStorage.setItem(HS_KEY,v?'1':'0')}catch{}}

    function hotspotPopupHtml(h){
      return `<div class="hs-popup"><b>${esc(L(h.name))}</b><span class="hs-days">${esc(t('hs_flooded_days',{n:h.days}))}</span><div>${esc(L(h.note))}</div><small>${esc(t('hs_popup_note'))}</small></div>`;
    }
    function showHotspotPopup(h){
      if(!mapInstance)return;
      hsPopup?.remove();
      hsPopupSpot=h;
      hsPopup=new maplibregl.Popup({offset:12,closeButton:false,maxWidth:'240px'}).setLngLat([h.lng,h.lat]).setHTML(hotspotPopupHtml(h)).addTo(mapInstance);
    }

    function addHotspotLayers(){
      if(!mapInstance||mapInstance.getSource('hotspots'))return;
      mapInstance.addSource('hotspots',{type:'geojson',data:hotspotGeoJSON()});
      const visibility=readPref()?'visible':'none';
      // Soft halo sized by how often the spot floods, plus a small solid centre.
      mapInstance.addLayer({id:'hs-halo',type:'circle',source:'hotspots',layout:{visibility},paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],10,['+',6,['*',0.5,['get','days']]],15,['+',16,['*',1.6,['get','days']]]],
        'circle-color':'#e8603c','circle-opacity':0.2,'circle-stroke-color':'#c2452f','circle-stroke-width':1.5,'circle-stroke-opacity':0.55}});
      mapInstance.addLayer({id:'hs-core',type:'circle',source:'hotspots',layout:{visibility},paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],10,3,15,6],'circle-color':'#c2452f','circle-stroke-color':'#fff','circle-stroke-width':1.5}});
      for(const id of ['hs-halo','hs-core']){
        mapInstance.on('mouseenter',id,()=>{mapInstance.getCanvas().style.cursor='pointer'});
        mapInstance.on('mouseleave',id,()=>{mapInstance.getCanvas().style.cursor=''});
      }
    }
    function hotspotAt(point){
      if(!mapInstance?.getLayer('hs-core')||mapInstance.getLayoutProperty('hs-core','visibility')==='none')return null;
      const f=mapInstance.queryRenderedFeatures(point,{layers:['hs-core','hs-halo']})[0];
      return f?FLOOD_HOTSPOTS[f.properties.i]:null;
    }
    function setHotspotsVisible(v){
      writePref(v);
      document.getElementById('hsToggle').checked=v;
      if(!v)hsPopup?.remove();
      for(const id of ['hs-halo','hs-core'])if(mapInstance?.getLayer(id))mapInstance.setLayoutProperty(id,'visibility',v?'visible':'none');
    }
    function renderHotspotList(){
      const max=Math.max(1,...FLOOD_HOTSPOTS.map(h=>h.days));
      document.getElementById('hsList').innerHTML=[...FLOOD_HOTSPOTS].sort((a,b)=>b.days-a.days).map(h=>{
        const i=FLOOD_HOTSPOTS.indexOf(h);
        return `<button type="button" class="hs-item" data-hs="${i}"><b>${esc(L(h.name))}</b><span class="hs-days">${esc(t('hs_days',{n:h.days}))}</span><span class="hs-bar"><i style="width:${Math.round(h.days/max*100)}%"></i></span><small>${esc(L(h.note))}</small></button>`;
      }).join('')+`<p class="hs-source">${esc(t('hs_source'))}</p>`;
      const list=document.getElementById('hsList');
      document.getElementById('hsListBtn').textContent=list.hidden?t('hs_see'):t('hs_hide');
    }

    // ----- report pins -----

    function reportCoords(r){if(r.lat!=null&&r.lng!=null)return [r.lat,r.lng];const a=(r.area||'').toLowerCase();if(a.includes('hillpark'))return [3.211,101.462];if(a.includes('suria')||a.includes('jeram'))return [3.241,101.413];if(a.includes('avatar'))return [3.222,101.447];return [3.212,101.434];}

    function pinElement(status,faded){
      const wrap=document.createElement('div');wrap.className='pin-wrap';
      const pin=document.createElement('div');pin.className=`signal-pin ${status}${faded?' old':''}`;wrap.appendChild(pin);return wrap;
    }

    function renderMapMarkers(list){
      if(!mapInstance)return;
      reportMarkers.forEach(m=>m.remove());reportMarkers.clear();
      list.filter(r=>!supersededBy(r)).forEach(r=>{
        const [lat,lng]=reportCoords(r);
        const img=r.hasPhoto?`<a href="${photoUrl(r.id,true)}" target="_blank" rel="noopener"><img class="popup-photo" src="${photoUrl(r.id)}" alt="${esc(t('photo_alt'))}" loading="lazy"></a>`:'';
        const lvl=r.waterLevel?`<br/><span class="level-chip">${LEVEL_ICON[r.waterLevel]||''} ${esc(t('lvl_long_'+r.waterLevel))}</span>`:'';
        const popup=`${img}<b>${esc(r.area)}</b>${lvl}<br/>${esc(fmtTime(r.time))} · ${esc(ageLabel(r.time))}<br/>${esc(r.details)}<br/><small>${esc(t('by',{who:whoName(r)}))}${r.lat==null?' · '+esc(t('approx')):''}</small>`;
        const m=new maplibregl.Marker({element:pinElement(r.status,ageMs(r)>FADE_AFTER),anchor:'bottom'})
          .setLngLat([lng,lat])
          .setPopup(new maplibregl.Popup({offset:34,closeButton:false}).setHTML(popup))
          .addTo(mapInstance);
        reportMarkers.set(r.id,m);
      });
    }

    function focusReport(id){
      const r=reports.find(x=>x.id===id);if(!r||!mapInstance)return;
      const [lat,lng]=reportCoords(r);
      document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'});
      mapInstance.flyTo({center:[lng,lat],zoom:Math.max(mapInstance.getZoom(),14)});
      reportMarkers.forEach(m=>{if(m.getPopup()?.isOpen())m.togglePopup()});
      const m=reportMarkers.get(id);if(m&&!m.getPopup().isOpen())m.togglePopup();
    }

    function renderPinStatus(){
      const el=document.getElementById('pinStatus');
      el.textContent=selectedCoordinates?t('spot_picked'):t('spot_none');
      el.classList.toggle('picked',!!selectedCoordinates);
    }
    function setSelectedPoint(lat,lng){
      selectedCoordinates=[Number(lat.toFixed(6)),Number(lng.toFixed(6))];
      if(draftMarker)draftMarker.remove();
      draftMarker=new maplibregl.Marker({element:pinElement('uncertain',false),anchor:'bottom'})
        .setLngLat([selectedCoordinates[1],selectedCoordinates[0]])
        .addTo(mapInstance);
      renderPinStatus();
    }

    function initMap(){
      const el=document.getElementById('map');
      if(!window.maplibregl){
        el.insertAdjacentHTML('afterbegin',`<div class="map-error">${esc(t('map_error'))}</div>`);
        return;
      }
      mapInstance=new maplibregl.Map({container:el,style:MAP_STYLE,center:[101.438,3.222],zoom:11.5,cooperativeGestures:true});
      mapInstance.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
      mapInstance.on('error',e=>console.warn('Map error:',e?.error||e));
      mapInstance.on('load',()=>{mapReady=true;addHotspotLayers()});
      mapInstance.on('click',e=>{
        // Clicks on an existing pin open its popup; don't also treat them as a new point.
        if(e.originalEvent.target.closest('.pin-wrap'))return;
        // Tapping a flood-prone spot shows its details, unless the user is picking a report location.
        const hs=!pickMode&&hotspotAt(e.point);
        if(hs){showHotspotPopup(hs);return}
        if(pickMode==='notify'){pickMode=null;notifySpot=[e.lngLat.lat,e.lngLat.lng];renderNotifySpot();openDialog('notifyDialog');toast(t('t_picked'));return}
        setSelectedPoint(e.lngLat.lat,e.lngLat.lng);
        if(pickMode==='report'){pickMode=null;openDialog('reportDialog');toast(t('t_picked'))}
      });
    }

    // ----- feed -----

    function renderReports(){
      const feed=document.getElementById('feed');
      const list=visibleReports();
      const older=hiddenOlderCount();
      const tagKey={danger:'tag_danger',clear:'tag_clear',uncertain:'tag_uncertain'};

      let html='';
      if(loadError)html+=`<div class="feed-error" role="alert">${t('load_error')}</div>`; // trusted string from STR
      html+=list.map(r=>{
        const later=supersededBy(r);
        const faded=ageMs(r)>FADE_AFTER||!!later;
        const tag=later?`<span class="report-tag clear">${esc(t('tag_later_clear'))}</span>`:`<span class="report-tag ${esc(r.status)}">${esc(t(tagKey[r.status]||'tag_other'))}</span>`;
        const actions=[`<button class="mini-btn" type="button" data-act="focus" data-id="${esc(r.id)}">${esc(t('act_map'))}</button>`];
        if(r.status!=='clear'&&!later){
          const done=confirmedIds.has(r.id);
          actions.push(`<button class="mini-btn${done?' done':''}" type="button" data-act="confirm" data-id="${esc(r.id)}"${done?' disabled':''}>${esc(t(done?'act_confirmed':'act_confirm'))}</button>`);
        }
        if(r.status!=='clear'&&!later&&r.type!=='weather')actions.push(`<button class="mini-btn good" type="button" data-act="clear" data-id="${esc(r.id)}">${esc(t('act_clear'))}</button>`);
        actions.push(`<button class="mini-btn wa" type="button" data-act="share" data-id="${esc(r.id)}">${esc(t('act_share'))}</button>`);
        const flagged=flaggedIds.has(r.id);
        actions.push(`<button class="mini-btn flag${flagged?' done':''}" type="button" data-act="flag" data-id="${esc(r.id)}"${flagged?' disabled':''}>${esc(t(flagged?'act_flagged':'act_flag'))}</button>`);
        if(canRemove(r))actions.push(`<button class="mini-btn danger" type="button" data-act="remove" data-id="${esc(r.id)}">${esc(t('act_remove'))}</button>`);
        const photo=r.hasPhoto?`<a class="report-photo" href="${photoUrl(r.id,true)}" target="_blank" rel="noopener"><img src="${photoUrl(r.id)}" alt="${esc(t('photo_alt'))}" loading="lazy"></a>`:'';
        const verified=r.userId!=null?` <span class="verified" title="${esc(t('verified'))}">✓</span>`:'';
        const level=r.waterLevel?`<span class="level-chip">${LEVEL_ICON[r.waterLevel]||''} ${esc(t('lvl_long_'+r.waterLevel))}</span>`:'';
        const confirms=r.confirmCount?`<span class="confirm-count">· ${esc(t('confirm_count',{n:r.confirmCount}))}</span>`:'';
        return `<article class="report${faded?' faded':''}" id="report-${esc(r.id)}"><span class="report-dot ${esc(r.status)}"></span><div><div class="report-title">${esc(r.area)}</div><div class="report-meta">${esc(fmtTime(r.time))} · ${esc(ageLabel(r.time))} · ${esc(t('by',{who:whoName(r)}))}${verified}${confirms}</div>${level}<p>${esc(r.details)}</p>${photo}<div class="report-actions">${actions.join('')}</div></div>${tag}</article>`;
      }).join('');
      if(!list.length&&!loadError)html+=`<div class="empty">${esc(t('empty'))}</div>`;
      if(older)html+=`<button type="button" class="older-toggle" data-act="older">${esc(showOlder?t('older_hide'):t('older_show',{n:older}))}</button>`;
      feed.innerHTML=html;
      renderMapMarkers(list);
    }

    async function markClear(id){
      const r=reports.find(x=>x.id===id);if(!r)return;
      if(!confirm(t('confirm_clear',{area:r.area})))return;
      try{
        const res=await fetch(`/api/reports/${id}/clear`,{method:'POST',headers:await authHeaders(true),body:JSON.stringify({who:document.getElementById('rName').value.trim()})});
        if(!res.ok){toast(await errorMessage(res));return}
        reports.unshift(await res.json());
        renderReports();
        toast(t('t_cleared'));
      }catch{toast(t('t_network'))}
    }

    const LEVEL_ICON={ankle:'🦶',knee:'🦵',waist:'🧍',car:'🚗'};

    async function confirmReport(id){
      if(confirmedIds.has(id))return;
      try{
        const res=await fetch(`/api/reports/${id}/confirm`,{method:'POST',headers:await authHeaders(true),body:'{}'});
        if(!res.ok){toast(await errorMessage(res));return}
        const {confirmCount}=await res.json();
        confirmedIds.add(id);writeJson(CONFIRMED_KEY,[...confirmedIds].slice(-300));
        const r=reports.find(x=>x.id===id);if(r)r.confirmCount=confirmCount;
        renderReports();toast(t('t_confirmed'));
      }catch{toast(t('t_network'))}
    }

    async function flagReport(id){
      const r=reports.find(x=>x.id===id);if(!r||flaggedIds.has(id))return;
      // Only signed-in people can flag, so a few people can't hide reports on their own.
      if(!me.signedIn){toast(t('flag_signin'),6000);window._signIn?.();return}
      if(!confirm(t('confirm_flag',{area:r.area})))return;
      try{
        const res=await fetch(`/api/reports/${id}/flag`,{method:'POST',headers:await authHeaders(true),body:'{}'});
        if(!res.ok){toast(await errorMessage(res));return}
        flaggedIds.add(id);writeJson(FLAGGED_KEY,[...flaggedIds].slice(-300));
        renderReports();toast(t('t_flagged'),5000);
      }catch{toast(t('t_network'))}
    }

    function shareReport(id){
      const r=reports.find(x=>x.id===id);if(!r)return;
      const later=supersededBy(r);
      const tagKey={danger:'tag_danger',clear:'tag_clear',uncertain:'tag_uncertain'};
      const tag=later?t('tag_later_clear'):t(tagKey[r.status]||'tag_other');
      const level=r.waterLevel?` · ${t('lvl_long_'+r.waterLevel)}`:'';
      const link=`${location.origin}/?r=${r.id}`;
      const text=`⚠️ ${tag}: ${r.area}${level}\n${fmtTime(r.time)} (${ageLabel(r.time)})\n${r.details}\n\n${t('share_view')} ${link}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank','noopener');
    }

    async function removeReport(id){
      const r=reports.find(x=>x.id===id);if(!r)return;
      if(!confirm(t('confirm_remove',{area:r.area})))return;
      try{
        const res=await fetch(`/api/reports/${id}`,{method:'DELETE',headers:await authHeaders()});
        if(!res.ok){toast(await errorMessage(res));return}
        reports=reports.filter(x=>x.id!==id);
        renderReports();
        toast(t('t_removed'));
      }catch{toast(t('t_network'))}
    }

    document.getElementById('feed').addEventListener('click',e=>{
      const b=e.target.closest('[data-act]');if(!b)return;
      const id=Number(b.dataset.id);
      ({focus:()=>focusReport(id),clear:()=>markClear(id),remove:()=>removeReport(id),confirm:()=>confirmReport(id),share:()=>shareReport(id),flag:()=>flagReport(id),retry:fetchReports,older:()=>{showOlder=!showOlder;renderReports()}})[b.dataset.act]?.();
    });

    // ----- photo: shrink on the phone before upload (also drops location data) -----

    async function loadImage(file){
      try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
      catch{
        return await new Promise((resolve,reject)=>{
          const url=URL.createObjectURL(file);const img=new Image();
          img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
          img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('decode failed'))};
          img.src=url;
        });
      }
    }
    function toJpeg(img,maxSide,quality){
      const w=img.width||img.naturalWidth,h=img.height||img.naturalHeight;
      const scale=Math.min(1,maxSide/Math.max(w,h));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      return c.toDataURL('image/jpeg',quality);
    }
    const dataUrlBytes=d=>Math.floor((d.length-d.indexOf(',')-1)*3/4);
    async function compressPhoto(file){
      const img=await loadImage(file);
      let full='';
      for(const [side,q] of [[1280,.72],[1024,.65],[800,.6]]){full=toJpeg(img,side,q);if(dataUrlBytes(full)<=450*1024)break}
      const thumb=toJpeg(img,360,.68);
      img.close?.();
      if(dataUrlBytes(full)>450*1024||dataUrlBytes(thumb)>75*1024)throw new Error('too large');
      return {full,thumb};
    }
    function clearPhoto(){
      pendingPhoto=null;
      document.getElementById('rPhoto').value='';
      document.getElementById('photoPreview').hidden=true;
      document.getElementById('photoImg').removeAttribute('src');
    }
    document.getElementById('rPhoto').addEventListener('change',async e=>{
      const file=e.target.files?.[0];if(!file)return;
      const submit=document.querySelector('#reportForm [type=submit]');
      submit.disabled=true;toast(t('t_photo_wait'));
      try{
        pendingPhoto=await compressPhoto(file);
        document.getElementById('photoImg').src=pendingPhoto.thumb;
        document.getElementById('photoPreview').hidden=false;
      }catch(err){
        console.warn('Photo error:',err);clearPhoto();toast(t('t_photo_bad'),5000);
      }finally{submit.disabled=false}
    });
    document.getElementById('photoRemove').onclick=clearPhoto;

    // ----- dialog and form -----

    function openDialog(id){document.getElementById(id).showModal()}
    function closeDialog(){document.querySelectorAll('dialog[open]').forEach(d=>d.close())}

    document.getElementById('reportOpen').onclick=()=>openDialog('reportDialog');
    document.getElementById('reportFab').onclick=()=>openDialog('reportDialog');
    document.getElementById('hsToggle').checked=readPref();
    document.getElementById('hsToggle').onchange=e=>setHotspotsVisible(e.target.checked);
    document.getElementById('hsListBtn').onclick=e=>{
      const list=document.getElementById('hsList');list.hidden=!list.hidden;
      e.currentTarget.setAttribute('aria-expanded',String(!list.hidden));
      e.currentTarget.textContent=list.hidden?t('hs_see'):t('hs_hide');
    };
    document.getElementById('hsList').addEventListener('click',e=>{
      const b=e.target.closest('[data-hs]');if(!b||!mapInstance)return;
      const h=FLOOD_HOTSPOTS[Number(b.dataset.hs)];
      setHotspotsVisible(true);
      document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'});
      mapInstance.flyTo({center:[h.lng,h.lat],zoom:Math.max(mapInstance.getZoom(),14)});
      mapInstance.once('moveend',()=>showHotspotPopup(h));
    });
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDialog);
    document.getElementById('choosePin').onclick=()=>{closeDialog();pickMode='report';toast(t('t_pick'));document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'})};
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderReports()});

    document.getElementById('reportForm').onsubmit=async e=>{
      e.preventDefault();
      const submit=e.target.querySelector('[type=submit]');
      const nameInput=document.getElementById('rName');
      const payload={
        type:document.getElementById('rType').value,
        status:document.getElementById('rStatus').value,
        area:document.getElementById('rArea').value.trim(),
        details:document.getElementById('rDetails').value.trim(),
        who:nameInput.value.trim(),
        lat:selectedCoordinates?selectedCoordinates[0]:null,
        lng:selectedCoordinates?selectedCoordinates[1]:null,
        waterLevel:document.getElementById('rType').value==='flood'?(document.querySelector('input[name=rLevel]:checked')?.value||null):null,
        photo:pendingPhoto
      };
      submit.disabled=true;submit.textContent=t('sending');
      try{
        const res=await fetch('/api/reports',{method:'POST',headers:await authHeaders(true),body:JSON.stringify(payload)});
        if(!res.ok){toast(await errorMessage(res),5000);return}
        reports.unshift(await res.json());
        selectedCoordinates=null;
        if(draftMarker){draftMarker.remove();draftMarker=null}
        const keepName=nameInput.disabled?nameInput.value:'';
        e.target.reset();
        nameInput.value=keepName;
        clearPhoto();
        updateLevelField();
        renderPinStatus();
        closeDialog();
        renderReports();
        toast(t('t_posted'));
        document.getElementById('feed').scrollIntoView({behavior:'smooth',block:'start'});
      }catch(err){
        console.error('Error submitting report:',err);
        toast(t('t_network'));
      }finally{
        submit.disabled=false;submit.textContent=t('send');
      }
    };

    // Tap outside a box to close it — but only when the press both starts and ends on the dark backdrop,
    // so the tap that opens a box (or a scroll inside it) can never close it straight away.
    document.querySelectorAll('dialog').forEach(d=>{
      let downOnBackdrop=false;
      d.addEventListener('pointerdown',e=>{downOnBackdrop=e.target===d});
      d.addEventListener('click',e=>{if(e.target===d&&downOnBackdrop)d.close();downOnBackdrop=false});
    });

    // ----- language switch -----
    document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
    window._onLangChange=()=>{
      renderHotspotList();renderReports();renderPinStatus();renderNotifyButton();renderNotifySpot();
      if(document.getElementById('radarToggle').checked)showRadar();
      if(hsPopup?.isOpen()&&hsPopupSpot)hsPopup.setHTML(hotspotPopupHtml(hsPopupSpot));
      window._renderAuth?.();
      const name=document.getElementById('rName');if(name.disabled)name.title=t('name_locked');
    };


    // ----- water level only applies to flood reports -----
    function updateLevelField(){
      const flood=document.getElementById('rType').value==='flood';
      document.getElementById('levelField').hidden=!flood;
      if(!flood)document.querySelectorAll('input[name=rLevel]').forEach(i=>{i.checked=false});
    }
    document.getElementById('rType').addEventListener('change',updateLevelField);
    // tapping the chosen level again clears it
    document.querySelectorAll('input[name=rLevel]').forEach(i=>i.addEventListener('click',()=>{if(i.dataset.was==='1'){i.checked=false;i.dataset.was='0'}else{document.querySelectorAll('input[name=rLevel]').forEach(x=>x.dataset.was='0');i.dataset.was='1'}}));
    updateLevelField();

    // ----- "use my location" -----
    function getPosition(){
      return new Promise((resolve,reject)=>{
        if(!navigator.geolocation)return reject(new Error('unsupported'));
        navigator.geolocation.getCurrentPosition(p=>resolve([p.coords.latitude,p.coords.longitude]),reject,{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
      });
    }
    document.getElementById('useGps').onclick=async()=>{
      toast(t('gps_wait'));
      try{
        const [lat,lng]=await getPosition();
        if(!inBounds(lat,lng)){toast(t('gps_far'),6000);return}
        if(!mapInstance){selectedCoordinates=[Number(lat.toFixed(6)),Number(lng.toFixed(6))];renderPinStatus()}
        else setSelectedPoint(lat,lng);
        toast(t('t_picked'));
      }catch{toast(t('gps_denied'),6000)}
    };

    // ----- rain radar (RainViewer) -----
    const RADAR_KEY='pa-radar';
    let radarTimer=null;
    async function showRadar(){
      if(!mapInstance)return;
      try{
        const res=await fetch('/api/radar');if(!res.ok)throw new Error('radar '+res.status);
        const {tiles,time}=await res.json();
        const add=()=>{
          if(mapInstance.getSource('radar'))mapInstance.getSource('radar').setTiles([tiles]);
          else{
            mapInstance.addSource('radar',{type:'raster',tiles:[tiles],tileSize:256,maxzoom:7,attribution:'<a href="https://www.rainviewer.com/" target="_blank" rel="noopener">Weather data by RainViewer</a>'});
            mapInstance.addLayer({id:'radar',type:'raster',source:'radar',paint:{'raster-opacity':0.6}},mapInstance.getLayer('hs-halo')?'hs-halo':undefined);
          }
        };
        mapReady?add():mapInstance.once('load',add);
        document.getElementById('radarTime').textContent=t('radar_time',{time:new Date(time).toLocaleTimeString(lang==='ms'?'ms-MY':'en-MY',{hour:'numeric',minute:'2-digit'})});
        clearTimeout(radarTimer);radarTimer=setTimeout(showRadar,10*60*1000);
      }catch(err){
        console.warn('Radar:',err);toast(t('radar_fail'));
        document.getElementById('radarToggle').checked=false;hideRadar();
      }
    }
    function hideRadar(){
      clearTimeout(radarTimer);
      if(mapInstance?.getLayer('radar'))mapInstance.removeLayer('radar');
      if(mapInstance?.getSource('radar'))mapInstance.removeSource('radar');
      document.getElementById('radarTime').textContent='';
    }
    document.getElementById('radarToggle').onchange=e=>{
      try{localStorage.setItem(RADAR_KEY,e.target.checked?'1':'0')}catch{}
      e.target.checked?showRadar():hideRadar();
    };
    if((()=>{try{return localStorage.getItem(RADAR_KEY)==='1'}catch{return false}})()){document.getElementById('radarToggle').checked=true;showRadar()}

    // ----- installable app -----
    const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
    const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    let installPrompt=null;
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('SW:',err));
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false});
    window.addEventListener('appinstalled',()=>{installPrompt=null;document.getElementById('installBtn').hidden=true;toast(t('t_installed'))});
    if(isIOS&&!isStandalone())document.getElementById('installBtn').hidden=false;
    document.getElementById('installBtn').onclick=async()=>{
      if(installPrompt){installPrompt.prompt();await installPrompt.userChoice.catch(()=>{});installPrompt=null;return}
      toast(t('install_ios'),9000);
    };

    // ----- flood alerts (push notifications) -----
    const NOTIFY_KEY='pa-notify';
    let pushKey=null;
    const pushSupported='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
    function b64urlToBytes(s){const pad='='.repeat((4-s.length%4)%4);const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
    function renderNotifyButton(){
      const saved=readJson(NOTIFY_KEY,null);
      const btn=document.getElementById('notifyBtn');
      btn.classList.toggle('on',!!saved);
      document.getElementById('notifyLabel').textContent=saved?t('notify_on',{km:saved.radiusKm}):t('notify_btn');
      document.getElementById('ntOff').hidden=!saved;
    }
    function renderNotifySpot(){
      const el=document.getElementById('ntSpot');
      el.textContent=notifySpot?t('spot_picked'):t('spot_none');
      el.classList.toggle('picked',!!notifySpot);
    }
    async function initNotify(){
      // iPhone only allows notifications from the installed app; still show the button so people learn how.
      if(!pushSupported&&!(isIOS&&!isStandalone()))return;
      try{const res=await fetch('/api/push/key');if(!res.ok)return;pushKey=(await res.json()).publicKey}catch{return}
      document.getElementById('notifyBtn').hidden=false;
      renderNotifyButton();
    }
    document.getElementById('notifyBtn').onclick=()=>{
      if(!pushSupported){toast(t('nt_ios'),9000);return}
      const saved=readJson(NOTIFY_KEY,null);
      if(saved){notifySpot=[saved.lat,saved.lng];document.getElementById('ntRadius').value=String(saved.radiusKm)}
      renderNotifySpot();openDialog('notifyDialog');
    };
    document.getElementById('ntUseGps').onclick=async()=>{
      toast(t('gps_wait'));
      try{const [lat,lng]=await getPosition();if(!inBounds(lat,lng)){toast(t('gps_far'),6000);return}notifySpot=[lat,lng];renderNotifySpot();toast(t('t_picked'))}
      catch{toast(t('gps_denied'),6000)}
    };
    document.getElementById('ntUseMap').onclick=()=>{closeDialog();pickMode='notify';toast(t('nt_pick'));document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'})};
    document.getElementById('notifyForm').onsubmit=async e=>{
      e.preventDefault();
      if(!notifySpot){toast(t('nt_need_spot'));return}
      const submit=e.target.querySelector('[type=submit]');submit.disabled=true;
      try{
        const permission=await Notification.requestPermission();
        if(permission!=='granted'){toast(t('nt_denied'),7000);return}
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToBytes(pushKey)});
        const radiusKm=Number(document.getElementById('ntRadius').value);
        const res=await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),lat:notifySpot[0],lng:notifySpot[1],radiusKm,lang})});
        if(!res.ok){toast(await errorMessage(res));return}
        writeJson(NOTIFY_KEY,{lat:notifySpot[0],lng:notifySpot[1],radiusKm});
        renderNotifyButton();closeDialog();toast(t('nt_done'));
      }catch(err){console.warn('Notify:',err);toast(t('nt_fail'))}
      finally{submit.disabled=false}
    };
    document.getElementById('ntOff').onclick=async()=>{
      try{
        const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
        if(sub){await fetch('/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}
      }catch(err){console.warn('Unsubscribe:',err)}
      try{localStorage.removeItem(NOTIFY_KEY)}catch{}
      renderNotifyButton();closeDialog();toast(t('nt_stopped'));
    };
    initNotify();

    // ----- donate (DuitNow QR) -----
    // The server shows the button only when icons/duitnow-qr.jpg exists. The QR starts loading in the
    // background straight away, so the box opens complete on the first tap instead of jumping.
    {
      const btn=document.getElementById('donateBtn'), img=document.getElementById('donateQr');
      if(!btn.hidden){
        const preload=()=>{if(!img.getAttribute('src'))img.src='/icons/duitnow-qr.jpg'};
        if('requestIdleCallback' in window)requestIdleCallback(preload,{timeout:4000});else setTimeout(preload,1500);
        btn.addEventListener('click',()=>{preload();openDialog('donateDialog')});
      }
    }

    // ----- links to one report: /?r=123 (from WhatsApp shares and notifications) -----
    let deepLinkId=Number(new URLSearchParams(location.search).get('r'))||null;
    function openDeepLink(){
      if(!deepLinkId)return;
      const r=reports.find(x=>x.id===deepLinkId);if(!r)return;
      deepLinkId=null;
      if(ageMs(r)>HIDE_AFTER){showOlder=true;renderReports()}
      if(currentFilter!=='all'&&r.type!==currentFilter){currentFilter='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));renderReports()}
      setTimeout(()=>focusReport(r.id),300);
    }

    renderHotspotList();
    renderPinStatus();
    initMap();
    fetchReports().then(openDeepLink);
    loadHotspots();
    // Keep the board current; skip while the tab is hidden.
    setInterval(()=>{if(!document.hidden)fetchReports()},REFRESH_EVERY);
  </script>
</body>
